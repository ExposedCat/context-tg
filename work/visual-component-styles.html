<style>
  .visual-kit {
    --night: #080b18;
    --surface: #12182b;
    --raised: #1e2844;
    --text: #f5f6ff;
    --muted: #bec8e2;
    --rule: #303c58;
    --outline: #7c89ad;
    --violet: #aa9aff;
    --cyan: #7ce7f4;
    --gradient: linear-gradient(110deg, var(--violet), var(--cyan));
    box-sizing: border-box;
    width: 100%;
    padding: clamp(12px, 3vw, 22px);
    border: 1px solid #354265;
    border-radius: 24px;
    background:
      radial-gradient(ellipse 70% 310px at 84% 0%, #24365f, transparent),
      radial-gradient(ellipse 65% 260px at 15% 0%, #2a2153, transparent),
      var(--night);
    color: var(--text);
    font: 16px/1.4 system-ui, sans-serif;
  }

  .visual-kit *, .visual-kit *::before, .visual-kit *::after { box-sizing: border-box; }
  .visual-kit :is(h1, h2, p, figure, blockquote, dl, dd, ol) { margin: 0; }

  .visual-kit .sheet-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px 14px;
    padding: 14px 7px 19px;
  }

  .visual-kit .sheet-header p {
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 750;
    letter-spacing: .12em;
  }

  .visual-kit .sheet-header h1 {
    font-size: clamp(34px, 7.3vw, 55px);
    line-height: 1;
    font-weight: 740;
    letter-spacing: -.06em;
  }

  .visual-kit .sheet-palette {
    display: grid;
    grid-template-columns: repeat(4, auto);
    gap: 8px;
    margin-bottom: 1px;
  }

  .visual-kit .sheet-palette span { display: grid; gap: 5px; color: var(--text); font: 11px/1.2 ui-monospace, monospace; }
  .visual-kit .sheet-palette i { height: 13px; border: 1px solid #adc6e44d; border-radius: 5px; background: var(--swatch); }

  .visual-kit .sample-group {
    margin-top: 12px;
    padding: 14px clamp(12px, 3vw, 18px) 3px;
    border: 1px solid var(--rule);
    border-radius: 17px;
    background: var(--surface);
  }

  .visual-kit .sample-group h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 0 10px;
    border-bottom: 1px solid var(--rule);
    font-size: 16px;
    font-weight: 680;
  }

  .visual-kit .sample-group h2::before { content: ""; width: 14px; height: 4px; border-radius: 9px; background: var(--gradient); }
  .visual-kit .sample-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 22px;
  }

  .visual-kit .sample {
    display: grid;
    grid-template-rows: auto 1fr;
    align-items: start;
    gap: 8px;
    min-width: 0;
    padding-top: 12px;
    padding-bottom: 13px;
  }

  .visual-kit .sample:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .visual-kit .sample-key { display: flex; flex-wrap: wrap; gap: 3px 8px; overflow-wrap: anywhere; }
  .visual-kit .sample-key code { color: var(--text); font: 650 15px/1.25 ui-monospace, monospace; }
  .visual-kit .sample-key code + code { color: var(--muted); font-size: 12px; font-weight: 500; align-self: end; }
  .visual-kit .sample-stage { min-width: 0; min-height: 70px; }

  .visual-kit .visual-metric {
    min-height: 82px;
    display: grid;
    align-content: center;
    gap: 1px;
    padding: 10px 13px;
    border: 1px solid var(--outline);
    border-radius: 12px;
    background: var(--raised);
  }

  .visual-kit .visual-metric.is-accent { border-color: transparent; background: var(--gradient); color: var(--night); }
  .visual-kit .visual-metric dt { font-size: 14px; font-weight: 650; }
  .visual-kit .visual-metric dd { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; font-variant-numeric: tabular-nums; }
  .visual-kit .visual-metric dd strong { font-size: 32px; line-height: 1; font-weight: 850; }
  .visual-kit .visual-metric small { font-size: 14px; font-weight: 750; }

  .visual-kit .visual-badges { display: flex; flex-wrap: wrap; gap: 7px; }
  .visual-kit .visual-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border: 1px solid var(--outline);
    border-radius: 99px;
    background: var(--raised);
    color: var(--text);
    font-size: 14px;
    font-weight: 650;
  }

  .visual-kit .visual-badge.is-accent { border-color: transparent; background: var(--gradient); color: var(--night); }
  .visual-kit .visual-badge.is-muted { background: transparent; border-style: dashed; font-weight: 500; }
  .visual-kit .visual-badge.is-accent::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .visual-kit .visual-meter { display: grid; gap: 6px; }
  .visual-kit .visual-meter > div:first-child { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 15px; }
  .visual-kit .visual-meter strong { font-size: 19px; }
  .visual-kit .visual-track { height: 10px; background: var(--rule); border-radius: 99px; overflow: hidden; }
  .visual-kit .visual-track span { display: block; width: var(--amount); height: 100%; background: var(--gradient); border-radius: inherit; }

  .visual-kit .visual-steps { display: grid; gap: 3px; padding: 0; list-style: none; }
  .visual-kit .visual-steps li { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 14px; }
  .visual-kit .visual-steps li::before { content: ""; width: 10px; height: 10px; border: 1px solid var(--outline); border-radius: 50%; }
  .visual-kit .visual-steps .is-done::before { border-color: transparent; background: var(--gradient); }
  .visual-kit .visual-steps .is-current { font-weight: 750; }
  .visual-kit .visual-steps .is-current::before { border: 3px solid var(--cyan); }

  .visual-kit .visual-callout {
    padding: 9px 11px;
    border-left: 3px solid var(--violet);
    border-radius: 0 8px 8px 0;
    background: var(--raised);
    font-size: 14px;
  }

  .visual-kit .visual-callout strong { display: block; font-size: 16px; }
  .visual-kit .visual-quote { border-left: 2px solid var(--cyan); padding: 2px 0 2px 11px; font-size: 16px; }
  .visual-kit .visual-quote cite { display: block; margin-top: 5px; color: var(--muted); font: 13px/1.3 system-ui, sans-serif; }
  .visual-kit .visual-formula { padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--night); text-align: center; }
  .visual-kit .visual-formula strong { font: italic 27px/1.2 Georgia, serif; }
  .visual-kit .visual-formula span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
  .visual-kit .visual-caption { font-size: 14px; }
  .visual-kit .visual-caption strong { display: block; margin-bottom: 2px; font-size: 15px; }
  .visual-kit .visual-divider { width: 30px; height: 3px; margin: 0 0 5px; border: 0; border-radius: 9px; background: var(--gradient); }

  .visual-kit .visual-facts { display: grid; }
  .visual-kit .visual-facts > div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
  .visual-kit .visual-facts > div:last-child { border-bottom: 0; }
  .visual-kit .visual-facts dd { font-weight: 750; font-variant-numeric: tabular-nums; }

  .visual-kit .visual-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
  .visual-kit .visual-table :is(th, td) { padding: 3px 6px; border-bottom: 1px solid var(--rule); }
  .visual-kit .visual-table thead { border-bottom: 1px solid var(--outline); }
  .visual-kit .visual-table tbody tr:last-child { background: var(--raised); }
  .visual-kit .visual-table :is(td, th):last-child { text-align: right; font-variant-numeric: tabular-nums; }

  .visual-kit .visual-bars { display: grid; gap: 6px; }
  .visual-kit .visual-bars > div { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; gap: 6px; font-size: 14px; }
  .visual-kit .visual-bars dd { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 7px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .visual-kit .visual-bars .visual-track { height: 9px; }
  .visual-kit .visual-bars div:nth-child(2) .visual-track span { background: #8e9ccb; }

  .visual-kit .visual-sparkline svg { display: block; width: 100%; height: 41px; }
  .visual-kit .visual-sparkline > div { display: flex; justify-content: space-between; gap: 6px; font-size: 14px; }

  @media (max-width: 480px) {
    .visual-kit .sample-grid { grid-template-columns: minmax(0, 1fr); }
    .visual-kit .sample + .sample { border-top: 1px solid var(--rule); }
    .visual-kit .sample-stage { min-height: 0; }
  }
</style>

<section id="gradient-visual-kit" class="visual-kit" aria-labelledby="gradient-visual-title">
  <header class="sheet-header">
    <div>
      <p>Telegram visuals</p>
      <h1 id="gradient-visual-title">Component kit</h1>
    </div>
    <div class="sheet-palette" aria-label="Midnight, violet, cyan, and white palette">
      <span><i style="--swatch:var(--night)" aria-hidden="true"></i>#080B18</span>
      <span><i style="--swatch:var(--violet)" aria-hidden="true"></i>#AA9AFF</span>
      <span><i style="--swatch:var(--cyan)" aria-hidden="true"></i>#7CE7F4</span>
      <span><i style="--swatch:var(--text)" aria-hidden="true"></i>#F5F6FF</span>
    </div>
  </header>

  <section class="sample-group" aria-labelledby="gradient-signals">
    <h2 id="gradient-signals">Highlights and status</h2>
    <div class="sample-grid">
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-metric</code><code>.is-accent</code></figcaption>
        <div class="sample-stage">
          <dl class="visual-metric is-accent"><dt>Weekly total</dt><dd><strong>248</strong><small>↑ 14%</small></dd></dl>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-badge</code><code>.is-accent</code><code>.is-muted</code></figcaption>
        <div class="sample-stage">
          <div class="visual-badges">
            <span class="visual-badge is-accent">Confirmed</span>
            <span class="visual-badge">Estimate</span>
            <span class="visual-badge is-muted">Archived</span>
          </div>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-meter</code></figcaption>
        <div class="sample-stage">
          <div class="visual-meter">
            <div><span>Weekly target</span><strong>72%</strong></div>
            <div class="visual-track" role="meter" aria-label="Weekly target" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"><span style="--amount:72%"></span></div>
          </div>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-steps</code><code>.is-done</code><code>.is-current</code></figcaption>
        <div class="sample-stage">
          <ol class="visual-steps">
            <li class="is-done">Collect (done)</li>
            <li class="is-current" aria-current="step">Review (current)</li>
            <li>Publish</li>
          </ol>
        </div>
      </figure>
    </div>
  </section>

  <section class="sample-group" aria-labelledby="gradient-data">
    <h2 id="gradient-data">Compact data</h2>
    <div class="sample-grid">
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-facts</code></figcaption>
        <div class="sample-stage">
          <dl class="visual-facts">
            <div><dt>Baseline</dt><dd>217</dd></div>
            <div><dt>Current</dt><dd>248</dd></div>
            <div><dt>Change</dt><dd>+31</dd></div>
          </dl>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-table</code></figcaption>
        <div class="sample-stage">
          <table class="visual-table" aria-label="Weekly totals">
            <thead><tr><th scope="col">Week</th><th scope="col">Total</th></tr></thead>
            <tbody><tr><td>Previous</td><td>217</td></tr><tr><td>Current</td><td>248</td></tr></tbody>
          </table>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-bars</code></figcaption>
        <div class="sample-stage">
          <dl class="visual-bars" aria-label="Weekly totals, scaled to 250">
            <div><dt>This</dt><dd><span class="visual-track" aria-hidden="true"><span style="--amount:99.2%"></span></span>248</dd></div>
            <div><dt>Last</dt><dd><span class="visual-track" aria-hidden="true"><span style="--amount:86.8%"></span></span>217</dd></div>
          </dl>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-sparkline</code></figcaption>
        <div class="sample-stage">
          <div class="visual-sparkline">
            <svg viewBox="0 0 300 41" preserveAspectRatio="none" role="img" aria-label="Four-week trend rises from 186 to 248">
              <defs>
                <linearGradient id="gradient-sparkline-stroke" x2="100%" y2="0%">
                  <stop stop-color="var(--violet)"/><stop offset="1" stop-color="var(--cyan)"/>
                </linearGradient>
                <linearGradient id="gradient-sparkline-fill" x2="0%" y2="100%">
                  <stop stop-color="var(--violet)" stop-opacity=".4"/><stop offset="1" stop-color="var(--cyan)" stop-opacity=".05"/>
                </linearGradient>
              </defs>
              <path d="M2 38 L100 17 L200 23 L298 3 V41 H2 Z" fill="url(#gradient-sparkline-fill)"/>
              <polyline points="2,38 100,17 200,23 298,3" fill="none" stroke="url(#gradient-sparkline-stroke)" stroke-width="2" vector-effect="non-scaling-stroke"/>
            </svg>
            <div><span>Four weeks</span><strong>↑ 33%</strong></div>
          </div>
        </div>
      </figure>
    </div>
  </section>

  <section class="sample-group" aria-labelledby="gradient-notes">
    <h2 id="gradient-notes">Notes and math</h2>
    <div class="sample-grid">
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-callout</code></figcaption>
        <div class="sample-stage">
          <aside class="visual-callout"><strong>Compare like for like</strong>Use complete weeks in both periods.</aside>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-quote</code></figcaption>
        <div class="sample-stage">
          <blockquote class="visual-quote">“Compare the averages first.”<cite>Review note</cite></blockquote>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-formula</code></figcaption>
        <div class="sample-stage">
          <div class="visual-formula"><strong>y = x² + 25</strong><span>Vertex at (0, 25)</span></div>
        </div>
      </figure>
      <figure class="sample">
        <figcaption class="sample-key"><code>.visual-caption</code><code>.visual-divider</code></figcaption>
        <div class="sample-stage">
          <hr class="visual-divider">
          <p class="visual-caption"><strong>Source</strong>Weekly activity log<br>Values rounded to whole units</p>
        </div>
      </figure>
    </div>
  </section>
</section>
